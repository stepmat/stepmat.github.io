<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gomoku vs AI</title>
<link rel="stylesheet" href="shared.css">
<style>
  #board-outer {
    background: #dcb468;
    padding: 20px;
    border: 4px solid #8b6000;
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }
  #board-wrap { position: relative; display: inline-block; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 40px);
    grid-template-rows: repeat(9, 40px);
    width: 360px; height: 360px;
    position: relative;
  }
  #board-lines {
    position: absolute; top: 0; left: 0;
    width: 360px; height: 360px; pointer-events: none;
  }
  .cell {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; user-select: none;
  }
  .cell.taken { cursor: default; }
  /* hover ghost */
  .cell:hover:not(.taken)::before {
    content: '';
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
    position: absolute; z-index: 1;
  }
  /* stones */
  .stone {
    width: 36px; height: 36px;
    border-radius: 50%;
    position: absolute; z-index: 2;
    pointer-events: none;
  }
  .stone.x {
    background: radial-gradient(circle at 38% 32%, #888, #111 68%);
    box-shadow: 1px 3px 6px rgba(0,0,0,0.65);
  }
  .stone.o {
    background: radial-gradient(circle at 38% 32%, #fff, #bbb 68%);
    box-shadow: 1px 3px 5px rgba(0,0,0,0.45);
    border: 1px solid #aaa;
  }
  .stone.win {
    box-shadow: 0 0 14px 6px rgba(255,220,40,0.9), 1px 3px 6px rgba(0,0,0,0.65);
  }
  #arrow-overlay {
    position: absolute; top: 0; left: 0;
    width: 360px; height: 360px; pointer-events: none; z-index: 3;
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Games</a>
  <h1>⬟ Gomoku</h1>
</div>
<div class="main">
  <div id="board-outer">
    <div id="board-wrap">
      <svg id="board-lines" viewBox="0 0 360 360"></svg>
      <div id="board"></div>
      <svg id="arrow-overlay" viewBox="0 0 360 360"></svg>
    </div>
  </div>
  <div id="sidebar" class="sidebar"></div>
</div>

<script src="shared.js"></script>
<script>
const SIZE = 9;
const WIN  = 5;
const TOTAL = SIZE * SIZE;

// hoshi positions for 9×9
const STAR_CELLS = new Set([2*SIZE+2, 2*SIZE+4, 2*SIZE+6,
                             4*SIZE+2, 4*SIZE+4, 4*SIZE+6,
                             6*SIZE+2, 6*SIZE+4, 6*SIZE+6]);

function checkWinner(board) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let i = 0; i < TOTAL; i++) {
    if (!board[i]) continue;
    const r = Math.floor(i/SIZE), c = i%SIZE;
    for (const [dr,dc] of dirs) {
      let len = 1;
      while (true) {
        const nr=r+dr*len, nc=c+dc*len;
        if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) break;
        if (board[nr*SIZE+nc] !== board[i]) break;
        len++;
      }
      if (len >= WIN) {
        const line = [];
        for (let k=0;k<len;k++) line.push((r+dr*k)*SIZE+(c+dc*k));
        return {winner: board[i], line};
      }
    }
  }
  if (board.every(c => c !== null)) return {winner:'draw', line:[]};
  return null;
}

function legalMoves(board) {
  return board.map((c,i) => c===null ? i : -1).filter(i => i>=0);
}

function applyMove(board, idx, player) {
  const b=[...board]; b[idx]=player; return b;
}

// ─── Heuristics ───────────────────────────────────────────────────────────────

function parsePW(id, def) {
  const v=parseFloat(document.getElementById(id).value);
  return isNaN(v) ? def : v;
}

function getHeuristicWeights() {
  return {
    line:       parsePW('hw-line', 0),

    center:     parsePW('hw-center', 0),
    corner:     parsePW('hw-corner', 0),
    sides:      parsePW('hw-sides', 0),
    mobility:   parsePW('hw-mobility', 0),
  };
}

// Score = sum of run_length^2 for each consecutive run of player pieces (longer = better)
function hLineCompletion(board, player) {
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let score=0;
  for (let i=0;i<TOTAL;i++) {
    const r=Math.floor(i/SIZE), c=i%SIZE;
    for (const [dr,dc] of dirs) {
      // only start scan from the beginning of each line
      const pr=r-dr, pc=c-dc;
      if (pr>=0&&pr<SIZE&&pc>=0&&pc<SIZE) continue;
      let run=0, nr=r, nc=c;
      while (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE) {
        const cell=board[nr*SIZE+nc];
        if (cell===player) run++;
        else { score+=run*run; run=0; }
        nr+=dr; nc+=dc;
      }
      score+=run*run;
    }
  }
  return score;
}

function hCenterProximity(board, player) {
  const center=(SIZE-1)/2;
  let score=0;
  for (let i=0;i<TOTAL;i++) {
    if (board[i]!==player) continue;
    const r=Math.floor(i/SIZE), c=i%SIZE;
    const dist=Math.abs(r-center)+Math.abs(c-center);
    score+=(SIZE-1-dist)/(SIZE-1);
  }
  return score;
}

function hCornerProximity(board, player) {
  const corners=[[0,0],[0,SIZE-1],[SIZE-1,0],[SIZE-1,SIZE-1]];
  const maxD=2*Math.floor((SIZE-1)/2); // max achievable min-distance-to-nearest-corner (at the center)
  let score=0;
  for (let i=0;i<TOTAL;i++) {
    if (board[i]!==player) continue;
    const r=Math.floor(i/SIZE), c=i%SIZE;
    const d=Math.min(...corners.map(([cr,cc])=>Math.abs(r-cr)+Math.abs(c-cc)));
    score+=(maxD-d)/maxD;
  }
  return score;
}

function hSidesProximity(board, player) {
  const maxD=Math.floor((SIZE-1)/2);
  let score=0;
  for (let i=0;i<TOTAL;i++) {
    if (board[i]!==player) continue;
    const r=Math.floor(i/SIZE), c=i%SIZE;
    const d=Math.min(r,SIZE-1-r,c,SIZE-1-c);
    score+=(maxD-d)/maxD;
  }
  return score;
}

function hMobility(board, player) {
  return legalMoves(board).length - legalMoves(board).length; // same pool; always 0
}

function evaluateBoard(board) {
  const r=checkWinner(board);
  if (r && r.winner==='X') return 1000;
  if (r && r.winner==='O') return -1000;
  if (r && r.winner==='draw') return 0;
  const hw=getHeuristicWeights();
  let score=0;
  if (hw.line)     score+=hw.line*(hLineCompletion(board,'X')-hLineCompletion(board,'O'));
  if (hw.center)   score+=hw.center*(hCenterProximity(board,'X')-hCenterProximity(board,'O'));
  if (hw.corner)   score+=hw.corner*(hCornerProximity(board,'X')-hCornerProximity(board,'O'));
  if (hw.sides)    score+=hw.sides*(hSidesProximity(board,'X')-hSidesProximity(board,'O'));
  if (hw.mobility) score+=hw.mobility*hMobility(board,'X');
  return score;
}

// ─── Game Object ─────────────────────────────────────────────────────────────

const gomokuGame = {
  moves(s) { return checkWinner(s.board) ? [] : legalMoves(s.board); },
  apply(s, m) { return {board:applyMove(s.board,m,s.turn), turn:s.turn==='X'?'O':'X'}; },
  evaluate(s) { return evaluateBoard(s.board); },
  isMaximizing(s) { return s.turn==='X'; },
  isTerminal(s) { return checkWinner(s.board)!==null || legalMoves(s.board).length===0; },
  simulate(s) {
    let cur=s;
    for (let i=0;i<80;i++) {
      if (checkWinner(cur.board)) break;
      const mvs=legalMoves(cur.board);
      if (!mvs.length) break;
      cur=gomokuGame.apply(cur, mvs[Math.floor(Math.random()*mvs.length)]);
    }
    const r=checkWinner(cur.board);
    if (!r) return 0.5;
    return r.winner==='O'?1:r.winner==='X'?0:0.5;
  },
};

// ─── Board Lines ─────────────────────────────────────────────────────────────

function drawBoardLines() {
  const svg = document.getElementById('board-lines');
  const ns = 'http://www.w3.org/2000/svg';
  const mkLine = (x1,y1,x2,y2) => {
    const l = document.createElementNS(ns,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#3a2010'); l.setAttribute('stroke-width','1');
    svg.appendChild(l);
  };
  for (let i=0;i<SIZE;i++) {
    const pos = i*40+20;
    mkLine(20, pos, 340, pos);   // horizontal
    mkLine(pos, 20, pos, 340);   // vertical
  }
  // star points (hoshi)
  for (const idx of STAR_CELLS) {
    const r=Math.floor(idx/SIZE), c=idx%SIZE;
    const dot = document.createElementNS(ns,'circle');
    dot.setAttribute('cx', c*40+20); dot.setAttribute('cy', r*40+20);
    dot.setAttribute('r', 4); dot.setAttribute('fill','#3a2010');
    svg.appendChild(dot);
  }
}

// ─── State ───────────────────────────────────────────────────────────────────

const state = {board:Array(TOTAL).fill(null), turn:'X', gameOver:false, aiArrowData:null, winLine:null};

function getState() { return {board:state.board, turn:state.turn}; }

function newGame() {
  state.board=Array(TOTAL).fill(null); state.turn='X';
  state.gameOver=false; state.aiArrowData=null; state.winLine=null;
  render();
  document.getElementById('thinking').textContent='';
  updateScorePanel();
  triggerNextPlayer();
}

// ─── Rendering ───────────────────────────────────────────────────────────────

function render(winLine = state.winLine) {
  const boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  for (let i=0;i<TOTAL;i++) {
    const cell=document.createElement('div');
    const classes=['cell'];
    if (state.board[i]) classes.push('taken');
    if (STAR_CELLS.has(i)) classes.push('star');
    cell.className=classes.join(' ');

    if (state.board[i]) {
      const stone=document.createElement('div');
      stone.className='stone '+(state.board[i]==='X'?'x':'o');
      if (winLine&&winLine.includes(i)) stone.classList.add('win');
      cell.appendChild(stone);
    }
    cell.addEventListener('click', ()=>handleClick(i));
    boardEl.appendChild(cell);
  }
  renderArrows();
}

function renderArrows() {
  const svg=document.getElementById('arrow-overlay');
  svg.innerHTML='';
  if (!state.aiArrowData || !showAIHints()) return;
  for (const {move,value,width} of state.aiArrowData) {
    const col=move%SIZE, row=Math.floor(move/SIZE);
    const x=col*40+20, y=row*40+20;
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',x); circle.setAttribute('cy',y);
    circle.setAttribute('r',Math.max(5,width*1.1));
    circle.setAttribute('fill',valueToColor(value));
    circle.setAttribute('opacity','0.6');
    svg.appendChild(circle);
  }
}

function updateScorePanel() {
  const panel=document.getElementById('score-panel');
  if (!isMinimaxActive()) { panel.style.display='none'; return; }
  panel.style.display='block';

  const board=state.board, hw=getHeuristicWeights();
  const r=checkWinner(board);
  const sections=[];

  for (const [player, sign, name] of [['X', 1, 'Black'], ['O', -1, 'White']]) {
    if (getPlayerType(player) !== 'minimax') continue;
    const fmt=v=>(sign*v).toFixed(2);
    const lines=[];
    if (r&&r.winner==='X') lines.push('Game over: Black wins!');
    else if (r&&r.winner==='O') lines.push('Game over: White wins!');
    else if (r) lines.push('Game over: Draw');
    if (hw.line)     { const v=hw.line*(hLineCompletion(board,'X')-hLineCompletion(board,'O')); lines.push(`Line Completion (×${hw.line}): ${fmt(v)}`); }
    if (hw.center)   { const v=hw.center*(hCenterProximity(board,'X')-hCenterProximity(board,'O')); lines.push(`Center Proximity (×${hw.center}): ${fmt(v)}`); }
    if (hw.corner)   { const v=hw.corner*(hCornerProximity(board,'X')-hCornerProximity(board,'O')); lines.push(`Corner Proximity (×${hw.corner}): ${fmt(v)}`); }
    if (hw.sides)    { const v=hw.sides*(hSidesProximity(board,'X')-hSidesProximity(board,'O')); lines.push(`Sides Proximity (×${hw.sides}): ${fmt(v)}`); }
    if (hw.mobility) { const v=hw.mobility*hMobility(board,'X'); lines.push(`Mobility (×${hw.mobility}): ${fmt(v)}`); }
    if (!lines.length) lines.push('No heuristics active');
    else if (!r) {
      const total=lines.reduce((acc,l)=>{ const m=l.match(/: ([-\d.]+)/); return acc+(m?parseFloat(m[1]):0); },0);
      lines.push('─────────────', `Total: ${total.toFixed(2)}`);
    }
    lines.push(`<span style="color:var(--color-text-muted);font-size:0.78rem">positive = good for ${name}</span>`);
    sections.push(`<b style="color:var(--color-text-muted);font-family:var(--font-family);font-size:0.82rem">${name}</b><br>`+lines.join('<br>'));
  }
  document.getElementById('score-breakdown').innerHTML=sections.join('<br><br>');
}

// ─── Interaction ──────────────────────────────────────────────────────────────

function triggerNextPlayer() {
  if (state.gameOver) return;
  const type = getPlayerType(state.turn);
  if (type === 'human') {
    document.getElementById('status-box').textContent = `${state.turn === 'X' ? 'Black' : 'White'}'s turn`;
    return;
  }
  document.getElementById('status-box').textContent = `${state.turn === 'X' ? 'Black' : 'White'} thinking...`;
  runAI(gomokuGame, getState(), ({move, arrowData}) => {
    state.aiArrowData = arrowData;
    if (move === null) return;
    state.board = applyMove(state.board, move, state.turn);
    state.turn = state.turn === 'X' ? 'O' : 'X';
    const winner = checkWinner(state.board);
    render(winner ? winner.line : null);
    updateScorePanel();
    if (winner) { endGame(winner); return; }
    triggerNextPlayer();
  });
}

function handleClick(idx) {
  if (state.gameOver || state.board[idx] !== null) return;
  if (getPlayerType(state.turn) !== 'human') return;
  state.aiArrowData = null;
  state.board = applyMove(state.board, idx, state.turn);
  state.turn = state.turn === 'X' ? 'O' : 'X';
  render();
  updateScorePanel();
  const result = checkWinner(state.board);
  if (result) { endGame(result); return; }
  triggerNextPlayer();
}

function endGame(result) {
  state.gameOver=true;
  state.winLine=result.line;
  document.getElementById('status-box').textContent=
    result.winner==='draw' ? 'Draw!' :
    result.winner==='X' ? 'Black wins!' : 'White wins!';
  render(result.line);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

const extraSettings = `
  <hr style="border-color:var(--color-border); margin:8px 0;">
  <div style="font-size:0.82rem;color:var(--color-text-muted);margin-bottom:8px;">Heuristic Weights <span style="font-size:0.75rem;">(0 = off)</span></div>
  <div class="piece-weight-row"><span data-tooltip="Scans all board lines and sums run² for each consecutive run of the player's pieces. A run of 2 = 4 pts, run of 3 = 9 pts. Longer runs score exponentially more.">Line Completion</span><input type="number" id="hw-line" value="0" min="0" step="1"></div>
  <div class="piece-weight-row"><span data-tooltip="Each piece scores 1 − d/maxD, where d is the Manhattan distance to the board centre and maxD is the maximum such distance. Centre = 1, furthest point = 0.">Center Proximity</span><input type="number" id="hw-center" value="0" min="0" step="1"></div>
  <div class="piece-weight-row"><span data-tooltip="Each piece scores 1 − d/maxD, where d is the minimum Manhattan distance to any corner and maxD is the board's max distance. On a corner = 1, furthest cell ≈ 0.">Corner Proximity</span><input type="number" id="hw-corner" value="0" min="0" step="1"></div>
  <div class="piece-weight-row"><span data-tooltip="Each piece scores (maxD − d)/maxD, where d is the minimum distance to any board edge. Border pieces score 1, the centre scores 0.">Sides Proximity</span><input type="number" id="hw-sides" value="0" min="0" step="1"></div>
  <div class="piece-weight-row"><span data-tooltip="Player's legal move count minus the opponent's. Always 0 in placement games where both players share the same pool of empty cells.">Mobility</span><input type="number" id="hw-mobility" value="0" min="0" step="1"></div>
`;

drawBoardLines();
buildSidebar({
  extraSettings,
  mmDepthMax: 4, mmDepthDefault: 2,
  uctSimsMax: 10000, uctSimsDefault: 1000,
  p1Label: 'Black', p2Label: 'White',
  extraPanels: `<div class="panel"><h3>Rules</h3><div style="font-size:0.82rem;color:var(--color-text-muted);line-height:1.6;">
    <b>Board:</b> 9×9 grid.<br>
    <b>Play:</b> Players alternate placing a stone on any empty intersection.<br>
    <b>Win:</b> First to get 5 or more stones in a row (row, column, or diagonal) wins.
  </div></div>`,
});

setupSharedUI({
  onAlgoChange: ()=>updateScorePanel(),
  onNewGame: newGame,
  onRender: render,
  onPlayerChange: triggerNextPlayer,
});

newGame();
</script>
</body>
</html>
